rules:
  proposal:
    - 'Include a `## Progress` section, per the progress-feedback spec. If the
      change adds or alters a CLI tool, a make target, or a UI action that can
      start a process longer than 3 seconds, say how it shows progress:
      `Terminal:` (the progress bar in the terminal) and/or `Page:` (the themed
      progress on the page). If it cannot meet the rule yet, write
      `Not yet — <reason>; follow-up: <change>` and say why in the design.
      Otherwise write `None — <reason>`. `make docs-check` fails without it.'
    - If the change adds or modifies a Jev call, state why Jev (not code or
      an LLM) is the right tool, per docs/rules/jev-usage.md §2 and §5.
    - Include a `## Documentation impact` section. Name each document the
      change makes untrue or incomplete (README.md, CLAUDE.md, docs/*.md,
      openspec/project.md, .github/copilot-instructions.md) and what changes
      in it, or say why none is affected. `make docs-check` fails without it.
    - Include a `## Stopping` section, per the stop-anything spec. If the
      change adds or alters work a person can start (a UI action, a job, an
      agent run, a CLI tool or a make target), give one line each for `Key:`
      (Esc on the page, Ctrl+C or SIGTERM in a terminal), `Stop:` (the
      protocol's own stop or this system's cancel route), `Recorded in:` (the
      store that records the stop, or `the request itself`) and `Shown:` (how
      the page or the terminal says it is stopping, then stopped). Otherwise
      write `None — <reason>`. `make docs-check` fails without it.
  specs:
    - For Jev-backed behavior, write scenarios for high-, medium- and
      low-confidence outcomes, including the fallback path.
  design:
    - For every Jev request, list state fields, questions (type,
      instructions, criteria), thresholds per action risk, fallback, and
      pinned model version.
  tasks:
    - Add a task to run the Jev review checklist (docs/rules/jev-usage.md §7)
      and to test on labeled inputs, including Bulgarian ones.
    - End with a Documentation task group that updates each document the
      proposal's Documentation impact names, runs `make docs` (never edit
      inside a `generated:` block by hand), and runs `make docs-check`.

operations:
  apply:
    guidance:
      - Read docs/rules/jev-usage.md before implementing or changing any call
        to /v1/systemone.
      - When a change adds or alters a route, a make target, a project, a
        model or a load-balancer location, update its documentation in the
        same change, then run `make docs` and `make docs-check`.
  archive:
    guidance:
      - Before archiving, run `make docs-check`. If it fails, stop and report
        its findings instead of archiving.
      - Then run an advisory, read-only review. Compare the change's diff
        with README.md, CLAUDE.md, docs/*.md, openspec/project.md and
        .github/copilot-instructions.md, and list sentences that the change
        may have made untrue. Fix them in the change, or report them to the
        user. The review never blocks the archive.
