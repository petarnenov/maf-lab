# maf-lab load balancer: the single entry point (host port 7171 → :80).
#   /api/*, /dev/*  → api pool (2+ replicas, least_conn — SSE connections are long-lived)
#   /mcp            → mcp-retrieval pool (stateless MCP, round robin)
#   /a2a, /.well-known/agent-card.json → api pool (A2A: discovery, token, both transports)
#   /compliance/*   → compliance pool (the second agent, path-hashed so a task stays on its replica)
#   /lb-health      → answered here
#   everything else → web (static SPA)
# Upstreams are resolved when nginx (re)loads: Docker DNS returns every replica, and `make up` reloads the balancer
# after scaling. (Dynamic `resolve` was dropped: a DNS refresh during failover could leave a request with no retry peer.)

worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format lb '$remote_addr "$request" $status upstream=$upstream_addr instance=$upstream_http_x_instance rt=$request_time';
    access_log /dev/stdout lb;
    error_log /dev/stderr warn;

    upstream api_pool {
        zone api_pool 64k;
        least_conn;
        server api:8080 max_fails=1 fail_timeout=10s;
        keepalive 32;
    }

    upstream mcp_pool {
        zone mcp_pool 64k;
        server mcp-retrieval:8080 max_fails=1 fail_timeout=10s;
        keepalive 32;
    }

    # The reviewer keeps a task in the replica that started it, so a task's follow-ups must come back to it.
    # Hashing the path does that without cookies: a task id is in the path of every follow-up (see DECISIONS.md).
    upstream compliance_pool {
        zone compliance_pool 64k;
        hash $request_uri consistent;
        server compliance:8080 max_fails=1 fail_timeout=10s;
        keepalive 32;
    }

    upstream web_pool {
        zone web_pool 64k;
        server web:80 max_fails=1 fail_timeout=10s;
    }

    # Retry another replica only on connect errors / 502 / 503 and never for non-idempotent requests
    # (nginx does not replay POST unless `non_idempotent` is listed), so a chat turn is never run twice.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    # A stopped replica's IP drops packets instead of refusing: fail the connect fast so the retry goes elsewhere.
    proxy_connect_timeout 2s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    client_max_body_size 1m;

    server {
        listen 80;
        server_name _;

        location = /lb-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # Chat stream (SSE): relay every event as it is produced; a turn may stay open for minutes.
        location = /api/chat {
            proxy_pass http://api_pool;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header X-Accel-Buffering no always;
        }

        location /api/ {
            proxy_pass http://api_pool;
            proxy_read_timeout 120s;
        }

        location /dev/ {
            proxy_pass http://api_pool;
        }

        # A2A: discovery is anonymous, the protocol itself may answer with a long-lived event stream.
        location = /.well-known/agent-card.json {
            proxy_pass http://api_pool;
        }

        location /a2a {
            proxy_pass http://api_pool;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header X-Accel-Buffering no always;
        }

        # Streamable HTTP MCP may answer a POST with an SSE stream: no buffering either.
        location = /mcp {
            proxy_pass http://mcp_pool;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 300s;
        }

        # The second agent, under its own prefix: its card, its token endpoint and its protocol.
        location /compliance {
            proxy_pass http://compliance_pool;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header X-Accel-Buffering no always;
        }

        location / {
            proxy_pass http://web_pool;
        }
    }
}
