# maf-lab load balancer: the single entry point (host port 7171 → :80).
#   /api/*, /dev/*  → api pool (2+ replicas, least_conn — SSE connections are long-lived)
#   a plugin's routes → conf.d/{http,server}/50-<plugin>.conf, written from its lb.http.conf / lb.server.conf
#   /a2a, /.well-known/agent-card.json → api pool (A2A: discovery, token, both transports)
#   /copilotkit/*   → copilot-runtime (CopilotKit's runtime: the web's way to the api's AG-UI agents)
#   /lb-health      → answered here
#   everything else → web (static SPA)
# Upstreams are resolved when nginx (re)loads: Docker DNS returns every replica, and `make up` reloads the balancer
# after scaling. (Dynamic `resolve` was dropped: a DNS refresh during failover could leave a request with no retry peer.)

worker_processes auto;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format lb '$remote_addr "$request" $status upstream=$upstream_addr instance=$upstream_http_x_instance rt=$request_time';
    access_log /dev/stdout lb;
    error_log /dev/stderr warn;

    # Generated by `make up` (introduce-plugins decision 2): the api pool from compose/lb/api.upstream.conf, then each
    # installed plugin's upstreams. conf.d is derived, never state, and git-ignored. It is written in two stages: the
    # core's alone before the stack starts, each plugin's snippets once its services are healthy, then a reload, so the
    # balancer never names a service that does not exist yet.
    include /etc/nginx/lb/conf.d/http/*.conf;

    # CopilotKit's runtime: one replica, wiring only. Its runs are AG-UI streams that stay open for minutes.
    upstream copilot_runtime_pool {
        zone copilot_runtime_pool 64k;
        server copilot-runtime:8080 max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    upstream web_pool {
        zone web_pool 64k;
        server web:80 max_fails=1 fail_timeout=10s;
    }

    # Retry another replica only on connect errors / 502 / 503 and never for non-idempotent requests
    # (nginx does not replay POST unless `non_idempotent` is listed), so a chat turn is never run twice.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    # A stopped replica's IP drops packets instead of refusing: fail the connect fast so the retry goes elsewhere.
    proxy_connect_timeout 2s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    client_max_body_size 1m;

    server {
        listen 80;
        # Inside the container only (not published): the inspectors share this network namespace and reach the lab at
        # http://localhost:7171, the same address the host uses.
        listen 7171;
        server_name _;

        # Each installed plugin's own locations (exact matches, so they win over the reservations below).
        include /etc/nginx/lb/conf.d/server/*.conf;

        # The route shapes plugins use are reserved (introduce-plugins decision 4): a plugin that is not installed
        # answers 404 here instead of falling through to the web app's index.html.
        location ~ ^/[a-z0-9-]+/mcp$ {
            return 404;
        }

        # Uninstalled MCP metadata must not fall through to the SPA. Installed exact locations take precedence.
        location ^~ /.well-known/oauth-protected-resource {
            return 404;
        }

        location ~ ^/[a-z0-9-]+/(a2a|\.well-known/agent-card\.json)(/|$) {
            return 404;
        }

        location = /lb-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # The agents' AG-UI streams (SSE): relay every event as it is produced; a turn or a test run may stay open for
        # minutes. The chat agent, and the test-generation run agent.
        location ^~ /copilotkit/ {
            proxy_pass http://copilot_runtime_pool;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 600s;
            add_header X-Accel-Buffering no always;
        }

        location = /api/chat {
            proxy_pass http://api_pool;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header X-Accel-Buffering no always;
        }

        location ^~ /api/ {
            proxy_pass http://api_pool;
            proxy_read_timeout 120s;
        }

        location ^~ /dev/ {
            proxy_pass http://api_pool;
        }

        location / {
            proxy_pass http://web_pool;
        }
    }
}
