# The api pool (introduce-plugins decision 2). Tracked and name-based: `make up` copies it to
# conf.d/http/00-api.conf, which nginx.conf includes, so every start heals the pool. Only an api restart for an
# in-process plugin rewrites that copy, transiently, as a list of the other replicas' addresses; it restores this
# form at its end and on interruption. Dynamic `resolve` stays dropped (see nginx.conf's header).
upstream api_pool {
    zone api_pool 64k;
    least_conn;
    server api:8080 max_fails=1 fail_timeout=10s;
    keepalive 32;
}
