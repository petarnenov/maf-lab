# CI mode (make CI_MODE=1 …): no model downloads, no secrets.
# Both Ollama services (`ollama`, `ollama-batch`) become a deterministic Ollama-compatible stub (embeddings + scripted
# chat); everything else is the real stack. Forced retrieval still calls search_documents over MCP, so tool calls, SSE and tenancy are real.
# The chat model and Jev answer from the stub: env/ci-models.env, listed after each service's own env files so its keys
# win (an env_file list is appended across merged files). A key it must change may not sit in a service's `environment:`.
services:
  ollama:
    image: maf-lab-ollama-stub
    build:
      context: ./ollama-stub
    cpuset: !reset null
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:11434/api/version"]
      interval: 3s
      timeout: 2s
      retries: 20

  ollama-batch:
    image: maf-lab-ollama-stub
    build:
      context: ./ollama-stub
    # A CI runner has fewer CPUs than the dev sets name; the stub needs no pinning.
    cpuset: !reset null
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:11434/api/version"]
      interval: 3s
      timeout: 2s
      retries: 20

  ollama-init:
    image: alpine:3.22
    entrypoint: ["true"]

  api:
    env_file: [env/ci-models.env]
