# External company IdP server build profile; apply the same options at build time.
# Version/catalog pin: VERSION (26.8.0). This file is not a realm-export property.
# Environment and CLI overrides must be passed to the offline gate before building.
features=organization:v1,token-exchange-standard:v2
features-disabled=preview,token-exchange,token-exchange-delegation,identity-brokering-api,twitter-broker
hostname=https://${MAF_IDP_HOSTNAME}
http-enabled=false
hostname-strict=true
https-certificate-file=${MAF_IDP_TLS_CERTIFICATE_FILE}
https-certificate-key-file=${MAF_IDP_TLS_CERTIFICATE_KEY_FILE}
health-enabled=true
metrics-enabled=true
db=postgres
db-url=${MAF_IDP_DB_URL}
db-username=${MAF_IDP_DB_USERNAME}
db-password=${MAF_IDP_DB_PASSWORD}
