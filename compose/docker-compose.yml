name: maf-lab

# One command brings everything up; the only application entry point is the load balancer on http://localhost:7171
#   docker compose -f compose/docker-compose.yml up -d --build
# Scale further with: docker compose -f compose/docker-compose.yml up -d --scale api=3 --scale mcp-retrieval=3
# Models are pulled by the ollama-init service on first start.
# To reuse models already pulled by a host Ollama: OLLAMA_MODELS_DIR=$HOME/.ollama docker compose ... up

x-app-env: &app-env
  Qdrant__Host: qdrant
  Qdrant__GrpcPort: "6334"
  Models__Provider: ${MODELS_PROVIDER:-ollama}
  Models__OllamaEndpoint: http://ollama:11434
  Models__ChatModel: ${CHAT_MODEL:-gpt-oss:120b}
  # Chat runs on Ollama Cloud; the key is passed through from the host environment, never written to a file.
  Models__ChatEndpoint: ${CHAT_ENDPOINT:-https://ollama.com}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  # Intent is classified by TypeSafe's Jev, and by nothing else; the retrieval server asks Jev whether a search's
  # candidates are relevant. Same rule as above: passed through from the host environment, never written to a file;
  # the api and mcp-retrieval send it only as the bearer header to the Jev endpoint.
  JEV_MAF_LAB: ${JEV_MAF_LAB:-}
  Models__OpenAIApiKey: ${OPENAI_API_KEY:-}
  Models__OpenAIEndpoint: ${OPENAI_ENDPOINT:-}
  Auth__SigningKey: ${AUTH_SIGNING_KEY:-maf-lab-dev-signing-key-change-me-0123456789}
  Billing__SeedPath: /seed/billing-runs.json
  Billing__AccountsSeedPath: /seed/billing-accounts.json
  # One A2A partner, so the agent card has something to authenticate. A dev secret, like the signing key above.
  A2A__PublicBaseUrl: ${A2A_PUBLIC_BASE_URL:-http://localhost:7171}
  A2A__Partners__acme-portal__Secret: ${A2A_PARTNER_SECRET:-acme-portal-dev-secret}
  A2A__Partners__acme-portal__Firms__0: firm-a
  A2A__Partners__acme-portal__Scopes__0: a2a.billing.read
  # The assistant's own credentials at the compliance reviewer: it consults as a system, never as a user.
  Compliance__BaseUrl: ${COMPLIANCE_BASE_URL:-http://lb/compliance}
  Compliance__ClientId: maf-lab-assistant
  Compliance__ClientSecret: ${COMPLIANCE_CLIENT_SECRET:-assistant-dev-secret}
  # Where the signals go. Unset it and the services export nothing, which is what the tests do.
  Telemetry__Endpoint: ${TELEMETRY_ENDPOINT:-http://otel-collector:4317}
  # The one place every replica reads. A service that needs it does not start without it.
  SharedState__ConnectionString: ${REDIS_CONNECTION:-redis:6379}

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.34.2
    ports:
      - "11435:11434"
    environment:
      # Keep the embedding model loaded: Ollama's default unloads it after 5 idle minutes, and the next search then
      # waits ~4-5 s for a cold load (embed is ~0.1 s warm). ollama-init loads it once at start.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama-models}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:0.34.2
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${OLLAMA_PULL_MODELS:-embeddinggemma}
    volumes:
      - ./pull-models.sh:/pull-models.sh:ro
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    restart: "no"

  mcp-retrieval:
    build:
      context: ..
      dockerfile: src/Maf.Lab.Retrieval/Dockerfile
    deploy:
      replicas: 2
    environment:
      <<: *app-env
      Urls: http://+:8080
      # Only this server writes, so only this server is told where the ledger lives.
      Billing__AdjustmentsConnectionString: Data Source=/app-data/maf-lab-adjustments.db
    volumes:
      - ./seed:/seed:ro
      # The applied-adjustments ledger: the only thing this server writes. Shared by its replicas, like the api's store.
      - retrieval-data:/app-data
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The portfolio domain: its own MCP server, corpus collection and read tools. Read-only, so no ledger and no volume
  # of its own; it reads the same seed folder for the household portfolios.
  mcp-portfolio:
    build:
      context: ..
      dockerfile: src/Maf.Lab.Portfolio/Dockerfile
    deploy:
      replicas: 2
    environment:
      <<: *app-env
      Urls: http://+:8080
      Portfolio__Collection: maf_portfolio_chunks
      Portfolio__MetaCollection: maf_portfolio_meta
      Portfolio__SeedPath: /seed/portfolio-households.json
    volumes:
      - ./seed:/seed:ro
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  # The codebase: the repository indexed by structure into its own collection (make index-code), searched and asked
  # about through its own MCP server. Read-only; the chunks carry their text, so the repository is not mounted.
  mcp-code:
    build:
      context: ..
      dockerfile: src/Maf.Lab.CodeSearch/Dockerfile
    deploy:
      replicas: 1
    environment:
      <<: *app-env
      Urls: http://+:8080
      CodeSearch__Collection: maf_code_chunks
      CodeSearch__MetaCollection: maf_code_meta
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  compliance:
    build:
      context: ..
      dockerfile: src/Maf.Lab.ComplianceAgent/Dockerfile
    deploy:
      replicas: 2
    environment:
      <<: *app-env
      Urls: http://+:8080
      # Its own audience and its own registry: a token for the assistant's surface is no good here.
      A2A__Audience: maf-lab-compliance
      A2A__PublicBaseUrl: ${COMPLIANCE_PUBLIC_URL:-http://localhost:7171/compliance}
      A2A__PathBase: /compliance
      A2A__RequiredScope: a2a.compliance.review
      A2A__Partners__maf-lab-assistant__Secret: ${COMPLIANCE_CLIENT_SECRET:-assistant-dev-secret}
      A2A__Partners__maf-lab-assistant__Scopes__0: a2a.compliance.review
    depends_on:
      redis:
        condition: service_healthy

  # Hands the api's volume to the user the api runs as: a new volume's mount point is created by root, and volumes from
  # before the api ran as that user hold root's files.
  api-data-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - api-data:/app-data
    command: ["chown", "-R", "${MAF_LAB_UID:-1000}:${MAF_LAB_GID:-1000}", "/app-data"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: src/Maf.Lab.Api/Dockerfile
    # The user who runs make (exported by it): the api writes into the repository (branches, merges), data/ and evals/,
    # and on Linux whatever it writes there belongs to this user. Root here left root-owned files in the checkout.
    user: "${MAF_LAB_UID:-1000}:${MAF_LAB_GID:-1000}"
    environment:
      <<: *app-env
      Urls: http://+:8080
      # Writable by any user; a uid with no passwd entry would otherwise get HOME=/.
      HOME: /tmp
      # Tool calls go through the balancer too, so they are spread over the mcp-retrieval replicas.
      Agent__McpEndpoint: http://lb/mcp
      # The second domain's server, also through the balancer. The billing server above keeps the domain "billing".
      Agent__Servers__0__Domain: portfolio
      Agent__Servers__0__Endpoint: http://lb/portfolio/mcp
      # The codebase as the agent's third domain (add-codebase-domain): only its search is offered to the agent;
      # ask_codebase writes an answer of its own and stays for other MCP clients.
      Agent__Servers__1__Domain: codebase
      Agent__Servers__1__Endpoint: http://lb/code/mcp
      Agent__Servers__1__Tools__0: search_codebase
      # The Code snippets tab asks the codebase server, as the user, through the balancer.
      CodeSearch__Endpoint: http://lb/code/mcp
      Storage__ConnectionString: Data Source=/app-data/maf-lab.db
      Indexing__CorpusRoot: /data
      Evals__Root: /evals
      # The drawn topology, served to the web app by the api (the web image is built from web/ only).
      Topology__DiagramPath: /docs/topology.drawio
      # The telemetry screen's numbers are read from here, by the api, never by the browser.
      Telemetry__PrometheusUrl: ${PROMETHEUS_URL:-http://prometheus:9090}
      Telemetry__JaegerUrl: ${JAEGER_URL:-http://localhost:7171/jaeger}
      Telemetry__TraceUrlTemplate: ${TRACE_URL_TEMPLATE:-http://localhost:7171/jaeger/trace/{traceId}}
      # The Coverage screen (add-coverage-dashboard-and-test-agent): the repository, the runner that measures it and
      # the agent that writes tests for it. Only the api may write to the repository (branches and merges).
      Coverage__RepoRoot: ${MAF_LAB_REPO:?set MAF_LAB_REPO to the repository path (make does)}
      CoverageRunner__BaseUrl: http://coverage-runner:8080
      TestAgent__BaseUrl: http://test-agent:8080
      TestAgent__ClientId: maf-lab-assistant
      TestAgent__ClientSecret: ${TEST_AGENT_CLIENT_SECRET:-assistant-testgen-dev-secret}
      # Optional: opens GitHub issues for suspected bugs. A token limited to this repository's issues, for the api only.
      GITHUB_ISSUES_TOKEN: ${GITHUB_ISSUES_TOKEN:-}
    deploy:
      replicas: 2
    # A push webhook points at whatever the caller registered, and the A2A conformance probe registers one on the
    # machine running it. Docker Desktop defines this name already; on Linux it has to be asked for.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-data:/app-data
      # The A2A billing skill reads the same seeded runs the retrieval server does.
      - ./seed:/seed:ro
      - ../data:/data
      - ../evals:/evals
      - ../docs:/docs:ro
      # At the host's own path: the repository's worktrees record host paths.
      - ${MAF_LAB_REPO}:${MAF_LAB_REPO}
    networks:
      - default
      - runner
    depends_on:
      api-data-init:
        condition: service_completed_successfully
      mcp-retrieval:
        condition: service_healthy
      mcp-portfolio:
        condition: service_healthy
      mcp-code:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The test-generation agent: A2A only, internal only. It holds the model key and reads the repository; the tests it
  # writes are built and run by the coverage runner, never here. Its environment is its own, not x-app-env: it has
  # no business with Jev, the billing partner or the retrieval settings.
  test-agent:
    build:
      context: ..
      dockerfile: src/Maf.Lab.TestAgent/Dockerfile
    deploy:
      replicas: 1
    environment:
      Urls: http://+:8080
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      Models__Provider: ollama
      Models__ChatEndpoint: ${CHAT_ENDPOINT:-https://ollama.com}
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-maf-lab-dev-signing-key-change-me-0123456789}
      A2A__Audience: maf-lab-test-agent
      A2A__PublicBaseUrl: http://test-agent:8080
      A2A__RequiredScope: a2a.testgen.run
      A2A__StoreKeyspace: testgen
      A2A__Partners__maf-lab-assistant__Secret: ${TEST_AGENT_CLIENT_SECRET:-assistant-testgen-dev-secret}
      A2A__Partners__maf-lab-assistant__Scopes__0: a2a.testgen.run
      TestAgent__RepoRoot: ${MAF_LAB_REPO}
      TestAgent__WorkRoot: /work
      TestAgent__RunnerBaseUrl: http://coverage-runner:8080
      Telemetry__Endpoint: ${TELEMETRY_ENDPOINT:-http://otel-collector:4317}
      SharedState__ConnectionString: ${REDIS_CONNECTION:-redis:6379}
    volumes:
      - ${MAF_LAB_REPO}:${MAF_LAB_REPO}:ro
      - testagent-work:/work
    networks:
      - default
      - runner
    depends_on:
      redis:
        condition: service_healthy
      coverage-runner:
        condition: service_healthy

  # The coverage runner builds and runs model-written tests: on the internal network only (no route out), with no
  # secret but the key it checks service tokens with, and the repository read-only.
  coverage-runner:
    build:
      context: ..
      dockerfile: src/Maf.Lab.CoverageRunner/Dockerfile
    deploy:
      replicas: 1
    environment:
      Urls: http://+:8080
      Auth__SigningKey: ${AUTH_SIGNING_KEY:-maf-lab-dev-signing-key-change-me-0123456789}
      Runner__RepoRoot: ${MAF_LAB_REPO}
      Telemetry__Endpoint: ${TELEMETRY_ENDPOINT:-http://otel-collector:4317}
    volumes:
      - ${MAF_LAB_REPO}:${MAF_LAB_REPO}:ro
      - runner-work:/work
    networks:
      - runner

  # CopilotKit's runtime, wiring only (agui-protocol-only): the browser's CopilotKit reaches the api's AG-UI agents through
  # it, through the balancer, with the caller's own bearer token. One replica: it keeps no state that matters.
  copilot-runtime:
    build:
      context: ../copilot-runtime
    environment:
      AGENTS_BASE_URL: http://lb
      PORT: "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The shared state store: conversations, run state, tasks, webhooks and idempotency keys.
  redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Everything the lab emits arrives here; where it goes from here is this file's business, not the services'.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otel/collector.yaml:ro
    # Also on the runner's internal network, so the runner's traces arrive without the runner reaching anything else.
    networks:
      - default
      - runner
    # The image is distroless: no shell, so nothing here can run a health command. The api probes it over HTTP
    # for the topology report, which is where its state is actually reported.
    depends_on:
      jaeger:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Served under /jaeger through the balancer, so its own links have to agree.
      QUERY_BASE_PATH: /jaeger
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:16686/jaeger/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  lb:
    image: nginx:1.30.5-alpine
    command: ["nginx", "-c", "/etc/nginx/lb/nginx.conf", "-g", "daemon off;"]
    ports:
      - "7171:80"
      # The A2A and MCP inspectors share this container's network (see below); their ports are published here, on
      # loopback only.
      - "127.0.0.1:7172:7172"
      - "127.0.0.1:7173:7173"
    volumes:
      # The directory, not the file: a single-file bind mount pins the file's inode, and a git checkout or merge
      # replaces the file with a new one — the balancer then keeps serving the old configuration and cannot reload.
      - ./lb:/etc/nginx/lb:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/lb-health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
      mcp-retrieval:
        condition: service_healthy
      mcp-portfolio:
        condition: service_healthy
      mcp-code:
        condition: service_healthy
      compliance:
        condition: service_healthy
      test-agent:
        condition: service_healthy
      coverage-runner:
        condition: service_healthy
      web:
        condition: service_healthy
      copilot-runtime:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      otel-collector:
        condition: service_started
      redis:
        condition: service_healthy

  # ── inspectors (profile `inspectors`: make enables it, CI_MODE=1 leaves it off) ─────────────────────────────────────
  # The A2A and MCP inspectors call the lab from their own backend. Inside lb's network namespace `localhost` is the
  # balancer, which also listens on 7171 there, so the URLs used on the host — and the ones the agent cards advertise —
  # work unchanged, on macOS and Linux alike.
  a2a-inspector:
    profiles: ["inspectors"]
    image: maf-lab-a2a-inspector
    build:
      context: https://github.com/a2aproject/a2a-inspector.git#8aa064639af106ff771d60428ef6d460f5454743
    # lab_app wraps upstream's app unchanged: the card URL filled in and a fresh partner token from /lab/token.
    command: ["uv", "run", "--", "uvicorn", "lab_app:app", "--app-dir", "/opt/lab", "--host", "0.0.0.0", "--port", "7172"]
    environment:
      LAB_A2A_CLIENT_ID: acme-portal
      LAB_A2A_CLIENT_SECRET: ${A2A_PARTNER_SECRET:-acme-portal-dev-secret}
      LAB_COMPLIANCE_CLIENT_ID: maf-lab-assistant
      LAB_COMPLIANCE_CLIENT_SECRET: ${COMPLIANCE_CLIENT_SECRET:-assistant-dev-secret}
    volumes:
      - ./a2a-inspector:/opt/lab:ro
    network_mode: "service:lb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7172/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      lb:
        condition: service_healthy

  mcp-inspector:
    profiles: ["inspectors"]
    image: ghcr.io/modelcontextprotocol/inspector:2.9.0
    # No volume: the server list and any secrets stay in the container, never in a plaintext secrets.json on disk.
    # start.mjs lists the lab's three MCP servers with a dev user's token (refreshed hourly), then starts the Inspector.
    entrypoint: ["node", "/opt/lab/start.mjs"]
    command: []
    environment:
      CLIENT_PORT: "7173"
      LAB_USER_ID: adam
      LAB_FIRM_ID: firm-a
      LAB_ROLE: ADVISOR
    volumes:
      - ./mcp-inspector:/opt/lab:ro
    network_mode: "service:lb"
    depends_on:
      lb:
        condition: service_healthy

  # Redis Insight reaches redis by service name; it has no login and can write, so it is published on loopback only.
  redis-insight:
    profiles: ["inspectors"]
    image: redis/redisinsight:3.8.0
    ports:
      - "127.0.0.1:7174:7174"
    environment:
      RI_APP_PORT: "7174"
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: maf-lab
      # Accepts the licence without a dialog; analytics and notifications then stay off.
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_FILES_LOGGER: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7174/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy

networks:
  default: {}
  # No route out: what runs on it can reach the runner and the collector, and nothing on the internet.
  runner:
    internal: true

volumes:
  testagent-work:
  runner-work:
  qdrant-data:
  ollama-models:
  api-data:
  retrieval-data:
  prometheus-data:
  redis-data:
