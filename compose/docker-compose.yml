name: maf-lab

# One command brings everything up; the only application entry point is the load balancer on http://localhost:7171
#   docker compose -f compose/docker-compose.yml up -d --build
# Scale further with: docker compose -f compose/docker-compose.yml up -d --scale api=3
# Models are pulled by the ollama-init service on first start, and loaded into both Ollama instances by ollama-warm.
# To reuse models already pulled by a host Ollama: OLLAMA_MODELS_DIR=$HOME/.ollama docker compose ... up

# Shared environment lives in env files (compose/env/*.env, by the library that reads it), which a plugin's compose file
# can list too: YAML anchors do not cross merged files (introduce-plugins 5.2).
services:
  # Interactive: search query embeddings only. Its CPUs are its own (default 0-3 of Docker Desktop's 16), so a batch on
  # ollama-batch cannot take CPU time from it. OLLAMA_INTERACTIVE_THREADS must match the size of this set.
  ollama:
    image: ollama/ollama:0.34.2
    cpuset: ${OLLAMA_INTERACTIVE_CPUS:-0-3}
    ports:
      - "11435:11434"
    environment:
      # Keep the embedding model loaded: Ollama's default unloads it after 5 idle minutes, and the next search then
      # waits ~4-5 s for a cold load (embed is ~0.1 s warm). ollama-warm loads it once at start.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      # Both instances share the models volume; only ollama-init pulls, and neither prunes blobs at start.
      OLLAMA_NOPRUNE: "1"
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama-models}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Batch: document embeddings (make index*, rebuild-index, migrate, /admin/index/run). The rest of the CPUs (default
  # 4-15); OLLAMA_BATCH_THREADS must match the size of this set.
  ollama-batch:
    image: ollama/ollama:0.34.2
    cpuset: ${OLLAMA_BATCH_CPUS:-4-15}
    ports:
      - "11436:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_NOPRUNE: "1"
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama-models}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:0.34.2
    depends_on:
      ollama:
        condition: service_healthy
      ollama-batch:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${OLLAMA_PULL_MODELS:-embeddinggemma}
    volumes:
      - ./pull-models.sh:/pull-models.sh:ro
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    restart: "no"

  # Loads the embedding model into each instance with that instance's thread count, so neither the first search nor
  # the first batch pays a cold load. `ollama run` cannot pass num_thread and the ollama image has no HTTP client,
  # hence busybox wget.
  ollama-warm:
    image: alpine:3.22
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      MODELS: ${OLLAMA_PULL_MODELS:-embeddinggemma}
      INSTANCES: http://ollama:11434=${OLLAMA_INTERACTIVE_THREADS:-4} http://ollama-batch:11434=${OLLAMA_BATCH_THREADS:-12}
    volumes:
      - ./warm-models.sh:/warm-models.sh:ro
    entrypoint: ["/bin/sh", "/warm-models.sh"]
    restart: "no"

  # Hands the api's volume to the user the api runs as: a new volume's mount point is created by root, and volumes from
  # before the api ran as that user hold root's files.
  api-data-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - api-data:/app-data
    command: ["chown", "-R", "${MAF_LAB_UID:-1000}:${MAF_LAB_GID:-1000}", "/app-data"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: src/Maf.Lab.Api/Dockerfile
      # full (dev, qa) or product (stage, prod; also run by qa): see Directory.Build.targets (introduce-plugins 5e).
      args:
        MAF_IMAGE_VARIANT: ${MAF_IMAGE_VARIANT:-full}
        MAF_PRODUCT_PLUGINS: ${MAF_PRODUCT_PLUGINS:-||}
    # The user who runs make (exported by it): the api writes into the repository (branches, merges) and evals/,
    # and on Linux whatever it writes there belongs to this user. Root here left root-owned files in the checkout.
    user: "${MAF_LAB_UID:-1000}:${MAF_LAB_GID:-1000}"
    env_file: [env/retrieval.env, env/platform.env, env/graph.env, env/a2a.env, env/observability.env, env/coverage.env]
    environment:
      Urls: http://+:8080
      # Writable by any user; a uid with no passwd entry would otherwise get HOME=/.
      HOME: /tmp
      Storage__ConnectionString: Data Source=/app-data/maf-lab.db
      Evals__Root: /evals
      # The installed plugins, read at run time from the mounted folder (introduce-plugins decision 2), and the
      # environment the deployment declares, which an installed plugin must allow.
      Plugins__Root: /plugins
      MAF_ENV: ${MAF_ENV:-dev}
      Auth__Authority: ${AUTH_AUTHORITY:-}
      Auth__CoreRoleClientId: ${AUTH_CORE_ROLE_CLIENT_ID:-api}
      Auth__WebClientId: ${AUTH_WEB_CLIENT_ID:-web}
    deploy:
      replicas: 2
    # Docker's stop grace exceeds the api's own drain (HostOptions.ShutdownTimeout = 30 s): SIGKILL never races the
    # write that records the runs a drain left cancelled (introduce-plugins decision 2).
    stop_grace_period: 40s
    # A push webhook points at whatever the caller registered, and the A2A conformance probe registers one on the
    # machine running it. Docker Desktop defines this name already; on Linux it has to be asked for.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-data:/app-data
      - ../evals:/evals
      # At the host's own path: the repository's worktrees record host paths.
      - ${MAF_LAB_REPO}:${MAF_LAB_REPO}
      # The plugin manifests and the installed set, read only.
      - ../plugins:/plugins:ro
    networks:
      - default
      - runner
    depends_on:
      api-data-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # CopilotKit's runtime, wiring only (agui-protocol-only): the browser's CopilotKit reaches the api's AG-UI agents through
  # it, through the balancer, with the caller's own bearer token. One replica: it keeps no state that matters.
  copilot-runtime:
    build:
      context: ../copilot-runtime
    environment:
      AGENTS_BASE_URL: http://lb
      PORT: "8080"
      # Agents beyond chat come from the installed plugins' manifests (introduce-plugins decision 3), re-read whenever
      # plugins/.installed changes.
      PLUGINS_ROOT: /plugins
    volumes:
      - ../plugins:/plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      # The repository root (introduce-plugins decision 8): each plugin's web part lives in plugins/<name>/web/.
      # web/Dockerfile.dockerignore keeps the context to web/ and those parts.
      context: ..
      dockerfile: web/Dockerfile
      args:
        MAF_IMAGE_VARIANT: ${MAF_IMAGE_VARIANT:-full}
        MAF_PRODUCT_WEB: ${MAF_PRODUCT_WEB:-||}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The shared state store: conversations, run state, tasks, webhooks and idempotency keys.
  redis:
    image: redis:8.8.3-alpine
    # Content-permission end acknowledgement must survive a crash before the next periodic AOF flush.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  lb:
    image: nginx:1.30.5-alpine
    command: ["nginx", "-c", "/etc/nginx/lb/nginx.conf", "-g", "daemon off;"]
    ports:
      - "7171:80"
      # The A2A and MCP inspector plugins' ports (they share this container's network) are published by the dev-only override,
      # docker-compose.dev.yml, never in CI, stage or prod.
    volumes:
      # The directory, not the file: a single-file bind mount pins the file's inode, and a git checkout or merge
      # replaces the file with a new one — the balancer then keeps serving the old configuration and cannot reload.
      - ./lb:/etc/nginx/lb:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/lb-health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      copilot-runtime:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  default: {}
  # No route out: what runs on it can reach the runner and the collector, and nothing on the internet.
  runner:
    internal: true

volumes:
  ollama-models:
  api-data:
  redis-data:
