# Runs on every push and pull request. Needs no secrets and no model downloads: the e2e job uses the Ollama-compatible
# stub (compose/docker-compose.ci.yml), so it also works for pull requests from forks. `make ci` runs the same locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  specs:
    name: OpenSpec validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: make specs

  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build with warnings as errors
        run: make lint-dotnet
      - name: Unit and integration tests (Testcontainers Qdrant)
        run: make test-dotnet

  web:
    name: Web lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make lint-web test-web build-web

  e2e:
    name: End-to-end stack (model-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Stack with the Ollama stub → index → verify through the balancer on :7171
        run: make ci-e2e WAIT_TIMEOUT=600
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p e2e-logs
          docker compose -f compose/docker-compose.yml -f compose/docker-compose.ci.yml ps -a > e2e-logs/ps.txt 2>&1 || true
          docker compose -f compose/docker-compose.yml -f compose/docker-compose.ci.yml logs --no-color > e2e-logs/compose.log 2>&1 || true
          cat e2e-logs/ps.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 7
