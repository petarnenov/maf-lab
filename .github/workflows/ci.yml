# Runs once per pull request commit (on the merge with main), on every push to main, and on demand for any branch
# (ci-once-per-pr): a push to a branch with an open pull request no longer runs everything twice. Needs no secrets and
# no model downloads: the e2e job uses the Ollama-compatible
# stub (compose/docker-compose.ci.yml), so it also works for pull requests from forks. `make ci` runs the same locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  specs:
    name: OpenSpec validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: make specs
      # The runner's own Python 3.12; the docs check needs nothing else (openspec/specs/documentation-sync).
      - run: make docs-check

  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build with warnings as errors
        run: make lint-dotnet
      - name: Unit and integration tests (Testcontainers Qdrant)
        run: make test-dotnet
      - name: A scaffolded plugin of each kind builds and keeps the docs in sync
        run: make plugin-new-check

  web:
    name: Web lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make lint-web test-web build-web

  product-image:
    # The product image variant (introduce-plugins decision 5e): what stage and prod run, built and checked here as qa's
    # run of it. It must hold no code of a plugin whose manifest does not allow stage or prod.
    name: Product image variant
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the product api and web images, check they hold no dev-or-qa-only plugin code
        run: make product-check CI_MODE=1 MAF_LAB_REPO="$PWD"

  e2e:
    name: End-to-end stack (model-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # make ci-e2e clones main for its test-generation run; the checkout is detached, so name it main.
      - run: git checkout -q -B main
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # make verify drives every agent with a bare AG-UI client (copilot-runtime/conformance.mjs).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Stack with the Ollama stub → index → verify through the balancer on :7171
        run: make ci-e2e WAIT_TIMEOUT=600
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p e2e-logs
          # make ci-e2e runs as its own compose project and leaves it running when it fails.
          # The same compose files make loaded, so the installed plugins' services show up too.
          export MAF_LAB_REPO="$PWD/.cache/e2e-repo"
          export COMPOSE_FILE="$(make -s print-compose-file CI_MODE=1)"
          docker compose -p maf-lab-e2e ps -a > e2e-logs/ps.txt 2>&1 || true
          docker compose -p maf-lab-e2e logs --no-color > e2e-logs/compose.log 2>&1 || true
          cat e2e-logs/ps.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 7

  e2e-core:
    # The core alone (introduce-plugins 7.1): `make core` — no plugin, no built-in domain — starts healthy, passes
    # verify with every plugin's checks skipping themselves, and declines a turn before any model, Jev or tool call.
    # In parallel with the all-plugins leg; the two share no stack.
    name: End-to-end core only (model-free)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: make core with the Ollama stub → verify → a turn declines with no model, Jev or tool call
        run: make ci-e2e-core WAIT_TIMEOUT=600
      - name: Collect diagnostics
        if: failure()
        run: |
          mkdir -p e2e-core-logs
          export MAF_LAB_REPO="$PWD"
          export COMPOSE_FILE="$(make -s print-compose-file CI_MODE=1 MAF_PLUGINS=none)"
          docker compose -p maf-lab-e2e-core ps -a > e2e-core-logs/ps.txt 2>&1 || true
          docker compose -p maf-lab-e2e-core logs --no-color > e2e-core-logs/compose.log 2>&1 || true
          cat e2e-core-logs/ps.txt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-core-logs
          path: e2e-core-logs/
          retention-days: 7
