<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maf-lab</title>
    <script>
      // Apply the stored theme before the first paint (add-theme-toggle; same key and attribute as src/theme/theme.ts).
      try {
        var theme = localStorage.getItem('maf-lab.theme');
        if (theme === 'light' || theme === 'dark')
          document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
