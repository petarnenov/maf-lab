# The facts `make docs` cannot read from code, and the exceptions `make docs-check` allows.
# Every exception carries a reason; one without a reason, or one that no longer matches anything, fails the check.
# See README "Keeping docs in sync" and openspec/specs/documentation-sync.

# One line per top-level directory (and per non-.NET directory under src/ or tools/) for the repo-layout block in
# openspec/project.md. .NET projects describe themselves with <Description> in their .csproj.
[layout]
".claude" = "Agent tooling: the OpenSpec skills and commands this repository's agents use"
".github" = "GitHub Actions workflows (ci, evals) and the Copilot instructions"
".vscode" = "Compound api + web debugging, and tasks for compose up, index and eval"
"compose" = "docker-compose.yml, nginx load balancer, Ollama stub for CI and external company IdP realm/profile templates"
"docs" = "HTTP API, trace events, telemetry and shared-state references; rules; screenshots; docs-sync.toml"
"evals" = "JSONL datasets per suite, the accepted baseline, and the run reports"
"openspec" = "Specs, active changes and the archive; project.md is the source for the OpenSpec context"
"plugins" = "One folder per plugin (plugin.toml, its compose, lb snippets, make targets, server and web parts); plugin.schema.json"
"scripts" = "The multi-line logic behind make targets (bash, and Python for docs and corpus stats)"
"src" = ".NET projects, one per service or shared library"
"tests" = "xUnit unit tests and Testcontainers integration tests"
"tools" = "Developer tools outside the running stack"
"tools/screenshots" = "Playwright script that captures the README screenshots in both themes"
"copilot-runtime" = "CopilotKit's runtime (Node), wiring only: the web reaches the api's AG-UI agents through it; the AG-UI conformance check"
"web" = "Vite + React app"

# Registered by the api but deliberately not rows in docs/http-api.md.
[routes.undocumented]
"GET /health" = "Infrastructure, not API: every host serves it for its Dockerfile HEALTHCHECK and the topology probe, not for clients"

# Rows in docs/http-api.md for routes an SDK registers, which no string literal in this repository shows.
[routes.library]
"/api/chat" = "MapAGUIServer (the Agent Framework's AG-UI hosting) registers it at ChatAgentEndpoint.Path"
"/.well-known/oauth-protected-resource/mcp" = "Billing's AddMcp authentication request handler serves its configured RFC9728 metadata URI in company mode"
"/.well-known/oauth-protected-resource/portfolio/mcp" = "Portfolio's AddMcp authentication request handler serves its configured RFC9728 metadata URI in company mode"
"/.well-known/oauth-protected-resource/code/mcp" = "Code's AddMcp authentication request handler serves its configured RFC9728 metadata URI in company mode"

# Rows in docs/http-api.md for routes another host serves behind the same balancer.
[routes.elsewhere]
"/copilotkit/info" = "copilot-runtime (CopilotKit's runtime, Node) serves it behind the balancer at /copilotkit/"
"/copilotkit/agent/{}/run" = "copilot-runtime serves it behind the balancer at /copilotkit/, for the chat and testgen agents"
"/copilotkit/agent/{}/stop/{}" = "copilot-runtime serves it behind the balancer at /copilotkit/, for the chat and testgen agents"

# A name in a checked document that matches a kind's pattern must equal the configured value for that kind.
[models.patterns]
chat = 'gpt-oss:\d+b|qwen3:\d+b|llama3(?:\.\d+)?:\d+b'
embedding = 'nomic-embed-text|embeddinggemma|mxbai-embed-large|bge-m3|snowflake-arctic-embed|all-minilm|qwen3-embedding'
jev = 'jev-\d+\.\d+\.\d+'

# Names that may appear although they are not the configured value.
[models.allowed]
"qwen3:4b" = "The local chat fallback DECISIONS.md records (Models__ChatModel=qwen3:4b), not the default"
