# The billing plugin's service (extract-billing), merged after the core's compose file by make. Paths resolve against
# compose/, as in every merged compose file.
#
# Its environment: retrieval.env (Qdrant, the Ollama instances, the chat model, Jev), platform.env (token validation,
# telemetry, the shared store), graph.env (the billing graph) and its own billing.env (where its seeds are). The host
# project stays in src/ until extract-evals (as code's does): the eval hosts it in process.
services:
  # Fee billing: documentation search, run status and history, the billing graph, fee adjustments.
  mcp-retrieval:
    build:
      context: ..
      dockerfile: src/Maf.Lab.Retrieval/Dockerfile
      # full or product, as the api's (introduce-plugins 5e): the provider plugins' code it keeps (introduce-provider-plugins).
      args:
        MAF_IMAGE_VARIANT: ${MAF_IMAGE_VARIANT:-full}
        MAF_PRODUCT_PLUGINS: ${MAF_PRODUCT_PLUGINS:-||}
    deploy:
      replicas: 2
    env_file: [env/retrieval.env, env/platform.env, env/graph.env, ../plugins/billing/files/billing.env]
    environment:
      # The installed providers (the decision engine the relevance judge asks), read from plugins/.installed.
      Plugins__Root: /plugins
      MAF_ENV: ${MAF_ENV:-dev}
      Auth__Authority: ${AUTH_AUTHORITY:-}
      Auth__CoreRoleClientId: ${AUTH_CORE_ROLE_CLIENT_ID:-api}
      Auth__ResourceUri: ${BILLING_MCP_RESOURCE_URI:-}
      Auth__TrustedProxyNetworks__0: ${MCP_TRUSTED_PROXY_NETWORK:-}
      Auth__Audience: billing
      Urls: http://+:8080
      # Only this server writes, so only this server is told where the ledger lives.
      Billing__AdjustmentsConnectionString: Data Source=/app-data/maf-lab-adjustments.db
    volumes:
      - ../plugins:/plugins:ro
      - ../plugins/billing/files/seed:/seed:ro
      # The applied-adjustments ledger: the only thing this server writes. Shared by its replicas, like the api's store.
      - retrieval-data:/app-data
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      ollama-warm:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  retrieval-data:
