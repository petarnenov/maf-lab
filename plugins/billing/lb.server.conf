# Billing's server at /mcp. Streamable HTTP MCP may answer a POST with an SSE stream: no buffering either.
location = /mcp {
    proxy_pass http://mcp_pool;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
}

# RFC9728 metadata keeps its complete well-known path; the SDK serves it anonymously in company mode.
location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://mcp_pool;
}
