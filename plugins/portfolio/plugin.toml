schema = 1
name = "portfolio"
kind = "mcp"
# Tenant-scoped, as a domain a tenant takes up is (per-tenant allow and enable arrive with enable-plugins-per-tenant).
scope = "tenant"
environments = ["dev", "qa", "stage", "prod"]
depends = ["qdrant"]
description = "Investment portfolios as a domain: its MCP server (mcp-portfolio: documentation search, an account's holdings, its quarter-end AUM history and the accounts a user can access), its corpus and seed, its data cards, and its domain descriptor and routing."
progress = "Terminal: make index-portfolio shows the indexer's progress bar; Page: a portfolio turn shows its steps and its data cards as it runs"
stopping = "Key: Ctrl+C on make index-portfolio, Esc on the chat page; Stop: the indexer stops at a safe point (exit 130), a turn stops through CopilotKit's stop; Recorded in: the indexer's run state and the run's state in the shared store; Shown: the bar ends with stopped, the turn says it was stopped"

[domain]
id = "portfolio"
order = 20
question_key = "in_portfolio"
description = "Investment portfolios on a wealth-management platform: what accounts and households hold, model portfolios and target weights, asset allocation, drift and tolerance bands, rebalancing, market value and quarter-end AUM valuations and their price corrections, why an account's market value or AUM changed (market movement, contributions, withdrawals), cash sweep, held-away assets, and investment performance and returns."
search_tool = "search_portfolio_documents"
guard_context = "documents"
prompt = "prompt.md"
subject = "investment portfolios"

[domain.read_tools]
get_household_portfolio = "Returns one account's current portfolio by its account id: holdings, allocation against its model, drift and total value."
get_aum_history = "Returns one account's quarter-end AUM valuations by its account id, oldest first, with each quarter's change."
list_my_accounts = "Lists the accounts the signed-in user can access: id, name, household, model portfolio and currency. Takes no account id."

[domain.card_types]
get_household_portfolio = "maf-lab/holdings"
get_aum_history = "maf-lab/aum-history"
list_my_accounts = "maf-lab/accounts"

[domain.intent]
data = "an account's portfolio: what an account holds, its allocation, drift or AUM"

[domain.scope_summary]
en = "portfolios (holdings, model portfolios, drift, rebalancing, quarter-end AUM)"
bg = "с портфейлите (позиции, моделни портфейли, отклонение, ребалансиране, AUM към края на тримесечието)"
