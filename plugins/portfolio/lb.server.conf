# Portfolio's server under its own prefix; the server itself serves MCP at /mcp. No buffering: a POST may stream SSE.
location = /portfolio/mcp {
    proxy_pass http://mcp_portfolio_pool/mcp;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
}

location = /.well-known/oauth-protected-resource/portfolio/mcp {
    proxy_pass http://mcp_portfolio_pool;
}
