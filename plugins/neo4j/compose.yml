# The graph store (introduce-plugins 8.1, extract-billing): billing relationships (firms, households, accounts, runs, fee
# schedules, documents) and the repository's code graph, built by `make graph`. Bolt is published on loopback only, for
# the host-side indexer; the Browser page is reached through the neo4j-browser plugin (dev and qa).
# Paths resolve against compose/, as in every merged compose file.
services:
  neo4j:
    image: neo4j:2026.09.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-maf-lab-dev-graph}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      # Where Neo4j Browser (served on 7474) tells the user's browser to open Bolt: the loopback port below.
      NEO4J_server_bolt_advertised__address: localhost:7687
    ports:
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/7687' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  neo4j-data:
