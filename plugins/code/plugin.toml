schema = 1
name = "code"
kind = "mcp"
scope = "installation"
depends = ["neo4j"]
environments = ["dev", "qa"]
description = "The lab's own source code as a domain: the codebase MCP server (search_codebase and the code-graph tools), its domain descriptor and routing, and the chat's Code snippets pane."
progress = "Terminal: make index-code and make graph-code show the indexer's progress bar; Page: the Code snippets pane shows its loading state while /api/code/snippets answers"
stopping = "Key: the user's request; Stop: Ctrl+C stops make index-code and make graph-code at a safe point (exit 130), Esc or leaving the page aborts the snippets request; Recorded in: the indexer's own run state; Shown: the bar ends with 'stopped', the pane drops its loading state"

[domain]
id = "codebase"
order = 30
question_key = "in_codebase"
description = "The maf-lab source code: its classes, methods, files and folders, tests, configuration, build and make targets, MCP servers and their tools, OpenSpec specifications and design decisions — how the software is written and where something is implemented in it. Not in it: questions about billing runs, fees, accounts or portfolios as business operations (why a run failed, how to re-run it, what a fee is), even when they mention errors or failures; questions about how the assistant behaves or performs in use (it is slow, it does not autocomplete); and general programming that is not about this code."
search_tool = "search_codebase"
graph_tools = ["trace_code_symbol", "change_impact"]
tools = ["search_codebase", "trace_code_symbol", "change_impact"]
search_any_intent = true
guard_context = "code"
prompt = "prompt.md"
# What Jev's contexts call the domain (extract-billing); code routes its own questions, so it adds no intent clause.
subject = "this lab's own source code"

[domain.scope_summary]
en = "questions about this lab's own code"
bg = "с въпроси за собствения код на лабораторията"
