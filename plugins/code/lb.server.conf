# The codebase server, under its own prefix; ask_codebase waits on the chat model, hence the longer timeout.
location = /code/mcp {
    proxy_pass http://mcp_code_pool/mcp;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
}

location = /.well-known/oauth-protected-resource/code/mcp {
    proxy_pass http://mcp_code_pool;
}
