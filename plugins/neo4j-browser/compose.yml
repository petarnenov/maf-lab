# The neo4j-browser plugin's only service (introduce-plugins 5.1), merged after the core's compose file by make.
services:
  # Neo4j Browser is a page on 7474; it opens Bolt from the user's browser at localhost:7687. The page is forwarded on
  # loopback only, and only while this plugin is installed.
  neo4j-browser:
    image: alpine/socat:1.8.1.3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec socat TCP-LISTEN:7175,fork,reuseaddr TCP:neo4j:7474
    ports:
      - "127.0.0.1:7175:7175"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7175"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      neo4j:
        condition: service_healthy
