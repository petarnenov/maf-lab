# The reviewer keeps a task in the replica that started it, so a task's follow-ups must come back to it. Hashing the path
# does that without cookies: a task id is in the path of every follow-up (see DECISIONS.md).
upstream compliance_pool {
    zone compliance_pool 64k;
    hash $request_uri consistent;
    server compliance:8080 max_fails=1 fail_timeout=10s;
    keepalive 32;
}
