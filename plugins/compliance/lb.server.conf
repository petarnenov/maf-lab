# The second agent, under its own prefix: its card, its token endpoint and its protocol.
location ^~ /compliance {
    proxy_pass http://compliance_pool;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    add_header X-Accel-Buffering no always;
}
