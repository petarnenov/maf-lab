# The assistant's A2A surface, served by the api (the a2a plugin's in-process part): discovery is anonymous, and the
# protocol itself may answer with a long-lived event stream. `^~` so the core's reservation of the A2A shapes (a regex)
# does not take /a2a while this plugin is installed.
location = /.well-known/agent-card.json {
    proxy_pass http://api_pool;
}

location ^~ /a2a {
    proxy_pass http://api_pool;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    add_header X-Accel-Buffering no always;
}
