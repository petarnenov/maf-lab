# A2A: discovery is anonymous, the protocol itself may answer with a long-lived event stream.
location = /.well-known/agent-card.json {
    proxy_pass http://api_pool;
}

location = /a2a {
    proxy_pass http://api_pool;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    add_header X-Accel-Buffering no always;
}

location ^~ /a2a/ {
    proxy_pass http://api_pool;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    add_header X-Accel-Buffering no always;
}
