# The telemetry stack (extract-observability-plugin): the collector every service sends its signals to, the metrics
# store the telemetry screen reads, and the trace store a turn's trace opens in. Merged after the core's compose file by
# make. Paths resolve against compose/, as in every merged compose file. Without this plugin the services' exports go
# nowhere, quietly (compose/env/platform.env).
services:
  # Everything the lab emits arrives here; where it goes from here is this file's business, not the services'.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ../plugins/observability/files/otel/collector.yaml:/etc/otel/collector.yaml:ro
    # Also on the runner's internal network, so the runner's traces arrive without the runner reaching anything else.
    networks:
      - default
      - runner
    # The image is distroless: no shell, so nothing here can run a health command. The api probes it over HTTP
    # for the topology report, which is where its state is actually reported.
    depends_on:
      jaeger:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ../plugins/observability/files/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Served under /jaeger through the balancer, so its own links have to agree.
      QUERY_BASE_PATH: /jaeger
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:16686/jaeger/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  prometheus-data:
