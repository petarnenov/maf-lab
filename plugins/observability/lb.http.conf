# The telemetry services are single instances: one place to send signals, one place to read them.
upstream otel_pool {
    zone otel_pool 64k;
    server otel-collector:4318 max_fails=1 fail_timeout=10s;
}

upstream jaeger_pool {
    zone jaeger_pool 64k;
    server jaeger:16686 max_fails=1 fail_timeout=10s;
}
