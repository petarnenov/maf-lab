# The browser's own spans, on their way to the collector. Only the OTLP/HTTP paths, nothing else of it.
location /v1/traces {
    proxy_pass http://otel_pool;
}

# Where a turn's trace is read. Jaeger serves itself under this path, so its own links agree.
location ^~ /jaeger {
    proxy_pass http://jaeger_pool;
}
